name: Frontend quality gate

on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: ['feature/**', 'codex/**']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify relative imports and demo isolation
        run: npm run verify:source
      - name: Test bounded RPC fanout and demo fixtures
        run: npm run test:foundation
      - name: Build frontend with ABI and TypeScript checks
        run: npm run build
