name: Frontend quality gate

on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: ['feature/**', 'codex/**']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify production source inventory
        run: npm run verify:source
      - name: Run frontend foundation tests
        run: npm run test:foundation
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend with ABI and TypeScript checks
        run: npm run build
